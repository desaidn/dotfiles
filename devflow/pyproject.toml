[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "dotfiles-devflow"
version = "0.1.0"
description = "Deterministic Git Work Flow and Review Flow rails"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.31.7,<2",
    "ruff>=0.14.14,<0.15",
]

[project.scripts]
devflow = "devflow.cli:main"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "devflow"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "all"
include = ["src"]
