# Number windows (tabs) from 1
set -g base-index 1
# Number panes from 1 as well
set -g pane-base-index 1

# New window (default key:  C-b c) – stay in current directory
unbind c
bind   c new-window -c "#{pane_current_path}"

# Vertical split (C-b ") – stay in current directory
unbind '"'
bind   '"' split-window -v -c "#{pane_current_path}"

# Horizontal split (C-b %) – stay in current directory
unbind %
bind   % split-window -h -c "#{pane_current_path}"

# Enable mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 10000

# Tmux chrome matches Neovim's normal-mode statusline color.
set -g status-style "bg=#a6dbff,fg=black,bold"
set -g status-left-style "bg=#a6dbff,fg=black,bold"
set -g status-right-style "bg=#a6dbff,fg=black,bold"
set -g window-status-style "bg=#a6dbff,fg=black,bold"
set -g window-status-current-style "bg=#a6dbff,fg=black,bold,underscore"
set -g message-style "bg=#a6dbff,fg=black,bold"
set -g mode-style "bg=#a6dbff,fg=black,bold"

# AI dock: vertical split with smaller left pane (45% AI, 58% code)
bind   a split-window -hb -l '45%' -c "#{pane_current_path}"

# Build runner: horizontal split with small bottom pane (20%)
bind   b split-window -v -l '32%' -c "#{pane_current_path}"

# Use vim-like keys for pane switching
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Use vim-like keys for copy and choice modes
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# Neovim :checkhealth recommended settings
set-option -sg escape-time 10
set-option -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set-option -a terminal-features 'xterm-256color:rgb'
