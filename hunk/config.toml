# Keep Hunk's review palette consistent across machines.
theme = "github-dark-default"

# Preserve horizontal code layout instead of wrapping long diff lines.
wrap_lines = true

# Hunk is the agent-authored changeset review surface, so show attached notes.
agent_notes = true

# Keep transient view toggles local to a session instead of rewriting dotfiles.
prompt_save_view_preferences = false
